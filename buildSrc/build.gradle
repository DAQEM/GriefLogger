plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // Shadow plugin
    implementation 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.4.1'

    // Ant (Required for Shadow)
    implementation 'org.apache.ant:ant:1.10.14'

    // Force latest ASM (Fixes "Unsupported class file major version" on newer Java bytecode)
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'
    implementation 'org.ow2.asm:asm-util:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-analysis:9.10.1'
}
