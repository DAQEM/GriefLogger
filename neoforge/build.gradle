import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id "com.github.johnrengelman.shadow"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$project.architectury_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "org.xerial:sqlite-jdbc:3.47.2.0"
    shadowBundle "org.xerial:sqlite-jdbc:3.47.2.0"

    modImplementation "com.mysql:mysql-connector-j:8.4.0"
    shadowBundle "com.mysql:mysql-connector-j:8.4.0"

    modImplementation "curse.maven:yaml-config-1128669:${project.config_library_file_neoforge}"
    modRuntimeOnly "curse.maven:ui-933200:${project.ui_library_file_neoforge}"
}

processResources {
    var replaceProperties = [
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_author": project.mod_author,
            "mod_license": project.mod_license,
            "mod_repository": project.mod_repository,

            "neoforge_loader_version": project.neoforge_loader_version,
            "minecraft_version": project.minecraft_version,
            "architectury_version": project.architectury_version,
            "config_library_version": project.config_library_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-dev-shadow"
}

// JAR without SQLite
tasks.register("shadowJarNoSQLite", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "org/sqlite/**" // Exclude SQLite driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-sqlite"
}

// JAR without MySQL
tasks.register("shadowJarNoMySQL", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "com/mysql/**" // Exclude MySQL driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-mysql"
}

// JAR without SQLite and MySQL
tasks.register("shadowJarNoSQLiteMySQL", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "org/sqlite/**" // Exclude SQLite driver
    exclude "com/mysql/**" // Exclude MySQL driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-sqlite-mysql"
}

tasks.build.dependsOn shadowJarNoSQLite, shadowJarNoMySQL, shadowJarNoSQLiteMySQL

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "neoforge"
}

remapSourcesJar {
    archiveClassifier = "neoforge-sources"
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")
    project {
        id = project.curse_forge_project_id
        releaseType = project.release_type
        changelogType = "markdown"
        changelog = rootProject.file('changelog.md')

        project.supported_minecraft_versions.split(',').each { version ->
            addGameVersion version
        }

        addGameVersion "Java 21"
        addGameVersion "NeoForge"

        relations {
            project.curseforge_dependencies.split(',').each { dep ->
                requiredDependency dep.trim()
            }
        }

        mainArtifact(remapJar) {
            displayName = "$project.mod_name NeoForge $project.minecraft_version - $project.mod_version"
        }

        addArtifact(remapSourcesJar) {
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_API_KEY")
    projectId = project.modrinth_project_id
    versionName = "$project.mod_name NeoForge $project.minecraft_version - $project.mod_version"
    versionNumber = "$project.mod_version"
    versionType = "$project.release_type"
    uploadFile = remapJar
    additionalFiles = [remapSourcesJar]
    gameVersions = project.supported_minecraft_versions.split(',').toList()
    loaders = ["neoforge"]
    changelog = rootProject.file('changelog.md').text
    dependencies {
        project.modrinth_dependencies.split(',').each { dep ->
            required.project dep
        }
    }
}