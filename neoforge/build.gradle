import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id "com.github.johnrengelman.shadow"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$project.architectury_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "org.xerial:sqlite-jdbc:3.47.2.0"
    shadowBundle "org.xerial:sqlite-jdbc:3.47.2.0"

    modImplementation "com.mysql:mysql-connector-j:8.4.0"
    shadowBundle "com.mysql:mysql-connector-j:8.4.0"

    modImplementation "curse.maven:yaml-config-1128669:${project.config_library_file_neoforge}"
    modRuntimeOnly "curse.maven:ui-933200:${project.ui_library_file_neoforge}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "config_library_version", config_library_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                "version": project.version,
                "config_library_version": config_library_version
        ])
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-dev-shadow"
}

// JAR without SQLite
tasks.register("shadowJarNoSQLite", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "org/sqlite/**" // Exclude SQLite driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-sqlite"
}

// JAR without MySQL
tasks.register("shadowJarNoMySQL", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "com/mysql/**" // Exclude MySQL driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-mysql"
}

// JAR without SQLite and MySQL
tasks.register("shadowJarNoSQLiteMySQL", ShadowJar) {
    exclude "architectury.common.json"
    exclude "org/slf4j/**"
    exclude "org/sqlite/**" // Exclude SQLite driver
    exclude "com/mysql/**" // Exclude MySQL driver

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-no-sqlite-mysql"
}

tasks.build.dependsOn shadowJarNoSQLite, shadowJarNoMySQL, shadowJarNoSQLiteMySQL

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "neoforge"
}

remapSourcesJar {
    archiveClassifier = "neoforge-sources"
}

curseforge {
    apiKey = System.getenv("CURSEFORGE_API_KEY")
    project {
        id = project.curse_forge_project_id
        releaseType = project.curse_forge_release_type
        changelogType = "markdown"
        changelog = rootProject.file('changelog.md')
        addGameVersion project.minecraft_version
        addGameVersion "Java 21"
        addGameVersion "NeoForge"

        relations {
            requiredDependency("architectury-api")
            requiredDependency("yaml-config")
        }

        mainArtifact(remapJar) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version"
        }

        addArtifact(remapSourcesJar) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version (Sources)"
        }

        addArtifact(shadowJarNoSQLite) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version (No SQLite)"
        }

        addArtifact(shadowJarNoMySQL) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version (No MySQL)"
        }

        addArtifact(shadowJarNoSQLiteMySQL) {
            displayName = "GriefLogger NeoForge $project.minecraft_version - $project.mod_version (No SQLite and MySQL)"
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_API_KEY")
    projectId = "8oGVUFuX"
    versionName = "GriefLogger NeoForge $rootProject.minecraft_version - $rootProject.mod_version"
    versionNumber = "$rootProject.mod_version"
    versionType = "$rootProject.curse_forge_release_type"
    uploadFile = remapJar
    additionalFiles = [remapSourcesJar, shadowJarNoSQLite, shadowJarNoMySQL, shadowJarNoSQLiteMySQL]
    gameVersions = ["$rootProject.minecraft_version"]
    loaders = ["neoforge"]
    dependencies {
        required.project "architectury-api"
        required.project "yaml-config"
    }
}